name: Build ARM64 Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  LINUX_ARM_ASSET: pathsafe-gui-linux-arm64.AppImage

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build Linux ARM64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Derive release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ]; then
            echo "Could not derive release version from tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pyinstaller

      - name: Run tests before building
        run: |
          pip install -e ".[dev,dicom,convert]"
          pytest tests/ -x -q

      - name: Install Linux display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libfuse2

      - name: Build with PyInstaller
        run: pyinstaller pathsafe.spec

      - name: Build ARM64 AppImage
        env:
          PATHSAFE_VERSION: ${{ env.VERSION }}
          PATHSAFE_OUTPUT_NAME: "PathSafe-${{ env.VERSION }}-aarch64.AppImage"
        run: |
          chmod +x installer/build_appimage_arm64.sh
          ./installer/build_appimage_arm64.sh

      - name: Rename AppImage
        run: mv "dist/PathSafe-${{ env.VERSION }}-aarch64.AppImage" "dist/${{ env.LINUX_ARM_ASSET }}"

      - name: Generate SHA256
        run: sha256sum "dist/${{ env.LINUX_ARM_ASSET }}" > "dist/${{ env.LINUX_ARM_ASSET }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          files: |
            dist/${{ env.LINUX_ARM_ASSET }}
            dist/${{ env.LINUX_ARM_ASSET }}.sha256
